name: Validate Mac shell profiles
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install shell dependencies for read-only tests
        run: |
          brew bundle install --no-upgrade --file=Brewfile
          git clone https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
          revision=$(sed -n 's/^ohMyZshCommit = "\(.*\)"/\1/p' home/.chezmoidata.toml)
          git -C "$HOME/.oh-my-zsh" checkout --detach "$revision"
      - name: Install Poetry and test dependencies
        run: |
          pipx install poetry
          POETRY_VIRTUALENVS_IN_PROJECT=true poetry install --no-interaction --sync
      - name: Run read-only test suite
        run: ./tests/run.sh

  fresh-home:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [personal, professional]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install chezmoi for integration test
        run: brew install chezmoi
      - name: Provision isolated temporary HOME
        env:
          DOTFILES_PROFILE: ${{ matrix.profile }}
          DOTFILES_SKIP_OPTIONAL_APPS: "1"
        run: bash ./tests/integration/run_fresh_home.sh

  git-review-e2e:
    name: Real Git review E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Git CLI
        run: |
          command -v git
          git --version
      - name: Install test runner
        run: python -m pip install 'pytest>=8.4,<9'
      - name: Execute real Git review workflows
        run: python -m pytest -q tests/integration/test_git_review_e2e.py
