name: Validate Mac shell profiles
# Validate feature changes once per PR, not again for every push to that PR.
# Direct updates to main still run CI; standalone branches can use the manual trigger.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected tests
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.select.outputs.profiles }}
      fresh_home: ${{ steps.select.outputs.fresh_home }}
      computer_use_e2e: ${{ steps.select.outputs.computer_use_e2e }}
      git_review_e2e: ${{ steps.select.outputs.git_review_e2e }}
      pysetup_real: ${{ steps.select.outputs.pysetup_real }}
      git_review_vscode: ${{ steps.select.outputs.git_review_vscode }}
      chezmoi_vscode_diff_gui: ${{ steps.select.outputs.chezmoi_vscode_diff_gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify changed files
        id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: main
          list-files: json
          filters: |
            all:
              - '**'
      - name: Select system tests (unknown changes run all)
        id: select
        env:
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.all_files }}
          CHANGED_FILES_COUNT: ${{ steps.changed.outputs.all_count }}
          FORCE_FULL_CI: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 src/ci/select_jobs.py

  ci-sanity:
    name: Fast CI and documentation checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check classifier and documentation
        run: |
          python -m pip install 'pytest>=8.4,<9' 'pyyaml>=6,<7'
          python -m pytest -q tests/unit/test_ci_select_jobs.py tests/unit/test_feature_documentation.py
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find home src tests -type f -name '*.sh' -print0)

  profiles:
    needs: changes
    if: ${{ needs.changes.outputs.profiles == 'true' }}
    # ARM64 hosted runners can fail to be acquired under capacity constraints.
    # Other jobs still cover macOS ARM64; keep this broad shell suite on Intel.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install shell dependencies for read-only tests
        run: |
          # Test-only runtime prerequisites; application provisioning is exercised with stubs.
          brew install chezmoi fzf zsh-autosuggestions zsh-syntax-highlighting python uv
          brew install luajit # Run Hammerspoon Lua scenarios against the real Lua modules.
          git clone https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
          revision=$(cat dependencies/git/common/oh-my-zsh.commit)
          git -C "$HOME/.oh-my-zsh" checkout --detach "$revision"
      - name: Install Poetry and test dependencies
        run: |
          pipx install poetry
          POETRY_VIRTUALENVS_IN_PROJECT=true poetry install --no-interaction --sync
      - name: Install isolated FastMCP runtime for real stdio integration
        run: uv sync --project home/dot_local/share/local-skills-mcp --frozen --no-dev
      - name: Run read-only test suite
        run: ./tests/run.sh

  fresh-home:
    needs: changes
    if: ${{ needs.changes.outputs.fresh_home == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise both supported Homebrew prefixes while reducing ARM64 demand.
          - profile: personal
            runner: macos-latest
          - profile: professional
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install chezmoi for integration test
        run: brew install chezmoi
      - name: Render and apply managed files in isolated HOME (no installer hooks)
        env:
          DOTFILES_PROFILE: ${{ matrix.profile }}
        run: bash ./tests/integration/run_fresh_home.sh

  computer-use-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.computer_use_e2e == 'true' }}
    name: Real computer-use tools and skills (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real chezmoi and Peekaboo CLIs
        run: |
          brew install chezmoi
          brew install openclaw/tap/peekaboo
      - name: Install and exercise browser and native Mac agent tooling
        env:
          RUN_COMPUTER_USE_E2E: '1'
        run: bash tests/integration/test_computer_use_real.sh

  git-review-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.git_review_e2e == 'true' }}
    name: Real Git review E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS Intel has proven available while ARM64 runner acquisition failed.
        # ARM64 coverage is retained in fresh-home and computer-use-e2e.
        os: [macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Git CLI
        run: |
          command -v git
          git --version
      - name: Install test runner
        run: python -m pip install 'pytest>=8.4,<9'
      - name: Execute real Git review workflows
        run: python -m pytest -q tests/integration/test_git_review_e2e.py

  pysetup-real:
    needs: changes
    if: ${{ needs.changes.outputs.pysetup_real == 'true' }}
    name: Real Python environment setup (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install test runner
        run: python -m pip install 'pytest>=8.4,<9'
      - name: Run real Poetry and uv environment integration
        env:
          CI: 'true'
        run: python -m pytest -q -s tests/integration/test_pysetup_real.py

  git-review-vscode:
    needs: changes
    if: ${{ needs.changes.outputs.git_review_vscode == 'true' }}
    name: Real VS Code Git extension (Ubuntu Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual VS Code and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Match the VS Code version used for local macOS GUI verification.
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            https://update.code.visualstudio.com/1.141.0/linux-deb-x64/stable \
            --output /tmp/vscode.deb
          sudo apt-get install -y /tmp/vscode.deb
          code --version
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8.4,<9'
      - name: Run real Git-to-VS-Code GUI integration under Xvfb
        env:
          RUN_VSCODE_GUI_E2E: '1'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python -m pytest -q -s tests/integration/test_git_review_vscode_gui.py

  chezmoi-vscode-diff-gui:
    needs: changes
    if: ${{ needs.changes.outputs.chezmoi_vscode_diff_gui == 'true' }}
    name: Real chezmoi VS Code diff editor (Ubuntu Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install VS Code, chezmoi and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            https://update.code.visualstudio.com/1.141.0/linux-deb-x64/stable \
            --output /tmp/vscode.deb
          sudo apt-get install -y /tmp/vscode.deb
          curl -fsSL https://get.chezmoi.io | sh -s -- -b /tmp/chezmoi-bin
          echo /tmp/chezmoi-bin >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8.4,<9'
      - name: Verify real diff tab and documents
        env:
          CI: 'true'
          RUN_VSCODE_GUI_E2E: '1'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python -m pytest -q -s tests/integration/test_chezmoi_vscode_gui.py