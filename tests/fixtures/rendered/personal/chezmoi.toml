sourceDir = "<DOTFILES_REPO>"

[data]
    profile = "personal"
    githubUsername = "ArthurZakirov"
    bwsAccount = "bws-macbook-air"

[diff]
    pager = ""
    command = "/bin/bash"
    args = ["<DOTFILES_REPO>/home/dot_local/bin/executable_chezmoi-code-diff", "<DOTFILES_REPO>"]
    exclude = ["scripts"]

[edit]
    command = "code"
    args = ["--wait"]

# Compare the live macOS shortcut configuration after normal file diffs.
[hooks.diff.post]
    command = "/usr/bin/env"
    args = ["python3", "<DOTFILES_REPO>/src/macos_shortcuts.py", "review", "<DOTFILES_REPO>/home/dot_config/macos-shortcuts/shortcuts.json"]
